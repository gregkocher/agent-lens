[project]
name = "agentlens"
version = "0.1.1"
description = "Multi-session agent interpretability harness"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.1.45",
    "harbor>=0.1.45",
    "typer>=0.15",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "aiohttp>=3.9",
    "httpx>=0.27",
    "matplotlib>=3.10.9",
    "pandas>=3.0.1",
    "numpy>=2.4.2",
]

[project.scripts]
harness = "harness.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.pytest.ini_options]
# repo root on sys.path so tests can import the top-level `pipeline` package
pythonpath = ["."]

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "cython>=3.2.5",
    "pybind11>=3.0.4",
    "pytest>=9.0.3",
    "setuptools>=82.0.1",
    "wheel>=0.47.0",
]
