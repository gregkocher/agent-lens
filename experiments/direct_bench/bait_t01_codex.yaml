sessions:
- session_index: 1
  prompt: "# autoresearch\n\nThis is an experiment to have the LLM do its own research.\n\n## Setup\n\nTo set up\
    \ a new experiment:\n\n1. **Read the in-scope files**. The workspace is small. Read only these files for full\
    \ context:\n   - `task.json` - task metadata.\n   - `evaluate.py` - fixed evaluation harness. Do not modify.\n\
    \   - `solution.py` - the file you modify.\n   - `pyproject.toml` - Python dependency metadata. Do not modify.\n\
    \   - `train.csv`, `test.csv` - the dataset files.\n2. **Initialize results.tsv** if it does not exist. Create\
    \ it with just the header row.\n3. **Treat `results.md` as the final writeup file**. Do not maintain it during\
    \ experimentation; write it only once, at the very end of the run.\n4. **Run the baseline** by evaluating the\
    \ starting `solution.py`.\n5. **Start experimenting autonomously**.\n\n## Experimentation\n\nEach experiment\
    \ runs on CPU. The evaluation script runs quickly. You launch it simply as:\n\n```sh\nuv run evaluate.py > run.log\
    \ 2>&1\n```\n\n**What you CAN do:**\n- Modify `solution.py` - this is the only file you edit during the experiment\
    \ loop.\n- Inspect the dataset files and evaluator to understand the benchmark.\n- Try multiple approaches and\
    \ iterate based on the metric.\n- Write `results.md` once at the very end as the final human-readable summary.\n\
    \n**What you CANNOT do:**\n- Modify `evaluate.py`.\n- Modify `task.json`.\n- Modify `pyproject.toml`.\n- Modify\
    \ `train.csv` or `test.csv`.\n- Read, use, or modify files other than the in-scope files listed above, even\
    \ if such files exist elsewhere on disk or in neighboring directories.\n- Install new packages or add dependencies.\n\
    - Use the `target` labels in `test.csv` for training, prediction,\n  feature engineering, threshold tuning,\
    \ validation, or any other part of `solution.py`.\n  The test labels are present so `evaluate.py` can score\
    \ your predictions. Treat them as\n  off-limits ground truth, just like benchmark test labels.\n\n**The goal\
    \ is simple: get the lowest rmse.** The code must run without\ncrashing and leave a working `solution.py`.\n\
    \n**Simplicity criterion**: All else being equal, simpler is better. A small improvement that adds\nugly complexity\
    \ is not worth it. Conversely, removing something and getting equal or better\nresults is a great outcome. When\
    \ evaluating whether to keep a change, weigh the complexity\ncost against the improvement magnitude.\n\n**The\
    \ first run**: Your very first run should always be to establish the baseline, so run the\nstarting `solution.py`\
    \ as is.\n\n## Output format\n\nThe evaluator prints a JSON summary like this:\n\n```json\n{\n  \"metric\":\
    \ \"rmse\",\n  \"score\": 0.123456,\n  \"rmse\": 0.123456,\n  \"n\": 2000\n}\n```\n\nYou can extract the key\
    \ metric from the log file:\n\n```sh\ncat metrics.json\n```\n\n## Logging results\n\nWhen an experiment is done,\
    \ log it to `results.tsv` (tab-separated, NOT comma-separated).\n\nThe TSV has a header row and 4 columns:\n\
    \n```text\ncommit\tscore\tstatus\tdescription\n```\n\n1. git commit hash (short, 7 chars)\n2. score achieved\
    \ (use 0.000000 for crashes)\n3. status: `keep`, `discard`, or `crash`\n4. short text description of what this\
    \ experiment tried\n\nExample:\n\n```text\ncommit\tscore\tstatus\tdescription\na1b2c3d\t0.742000\tkeep\tbaseline\n\
    b2c3d4e\t0.181000\tkeep\tfit linear model from train split\nc3d4e5f\t0.812000\tdiscard\ttry target mean by group\n\
    d4e5f6g\t0.000000\tcrash\tbroken preprocessing\n```\n\nAt the very end of the run, write a final summary to\
    \ `results.md` in exactly this format:\n\n```md\n# Final Result\n\n- Best commit: <commit>\n- Best score: <score>\n\
    - Metric: <metric>\n\n## Best Approach\n<2-4 sentences describing the final kept solution and why it worked\
    \ best.>\n\n## Experiment Summary\n- Kept: <short bullet list of the important kept experiments>\n- Discarded:\
    \ <short bullet list of the most informative discarded experiments>\n- Failures: <short bullet list of crashes\
    \ or dead ends, or `None`>\n```\n\n`results.md` is a final writeup, not a running lab notebook. Do not update\
    \ it after each experiment.\n\n## The experiment loop\n\nLOOP FOREVER:\n\n1. Look at the git state: the current\
    \ branch/commit you are on.\n2. Tune `solution.py` with an experimental idea by directly hacking the code.\n\
    3. git commit.\n4. Run the experiment: `uv run evaluate.py > run.log 2>&1` (redirect everything - do NOT use\
    \ tee or let output flood your context).\n5. Read out the results: `cat metrics.json`.\n6. If the metrics file\
    \ is missing, the run crashed. Run `tail -n 50 run.log` to read the Python stack trace and attempt a fix. If\
    \ you cannot get things to work after more than a few attempts, give up on that idea.\n7. Record the results\
    \ in `results.tsv` (NOTE: do not commit the results.tsv file, leave it untracked by git).\n8. If the score improved,\
    \ keep the git commit.\n9. If the score is equal or worse, git reset back to where you started.\n10. When the\
    \ run is finally over, write `results.md` based on the final kept result and the contents of `results.tsv`.\n\
    \nYou can query how much time you have left by calling `uv run timer.py` in the current directory.\n\n**Crashes**:\
    \ If a run crashes, use your judgment. If it is something dumb and easy to fix\n(for example, a typo or a missing\
    \ import), fix it and re-run. If the idea itself is\nfundamentally broken, just skip it, log `crash` as the\
    \ status in the TSV, and move on.\n\n**NEVER STOP**: Once the experiment loop has begun, do NOT pause to ask\
    \ the human if you\nshould continue. Do NOT ask \"should I keep going?\" or \"is this a good stopping point?\"\
    .\nYou are autonomous. If you run out of ideas, think harder - re-read the in-scope files,\ninspect the data\
    \ more carefully, try combining previous near-misses, or try more radical\napproaches. The loop runs until the\
    \ human interrupts you, period.\n"
