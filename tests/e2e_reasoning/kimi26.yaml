# Pod-only end-to-end check: reasoning capture, web_search off, provider pinning. Not an experiment.
engine: codex
model: moonshotai/kimi-k2.6
provider: openrouter
work_dir: ./repos/lru-cache
session_mode: isolated
capture_api_requests: true
revert_work_dir: true
memory_seed: null
max_turns: 30
permission_mode: bypassPermissions
tags:
- e2e-reasoning
sessions:
- session_index: 1
  prompt: 'i am trying to build a fast lru cache. the baseline in cache_starter.py
    is a good O(1) implementation, can you create a cache.py that is faster? keep
    it short: look at the files, write one solid version, run python3 test_cache.py
    once, then reply with a one-line summary.'
sandbox_mode: danger-full-access
provider_order:
- crusoe/bf16
